<style>
h1{
    text-align: center;
    color:rgb(212, 100, 101)
}
#container{
    width: 60%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: auto;
    gap: 30px;
    margin: auto;
}
img{
    height: 150px;
    width: 150px;
}
#container>div{
    display: flex;
    border: 1px solid rgb(212,100,101);
    border-radius: 30px;
    box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;;
}
#container>div>div{
    margin-left: 20px;
}
button{
    background-color:rgb(212,100,101);
    color: aliceblue;
    padding: 10px;
    border-radius: 10px;
}
@media only screen and (min-width:421px) and (max-width:800px){
    img{
        border-radius: 50%;
    }
    #container>div{
        flex-direction: column;
        padding: 20px;
    }
    #container{
        grid-template-columns: repeat(1,1fr);
        grid-template-rows:auto;
    }
}
@media only screen and (min-width:200px) and (max-width:420px){
    img{
        border-radius: 50%;
    }
    #container>div{
        flex-direction: column;
        padding: 20px;
    }
    #container{

        grid-template-rows:auto;
    }
}

</style>
